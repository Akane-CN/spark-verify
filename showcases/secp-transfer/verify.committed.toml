[meta]
name = "secp-transfer-committed"
spec = "0.1.0-draft.3"
description = "A signed secp256k1 transfer commits and creates a live output Cell."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"

[replay]
dependencies = []

[setup]
accounts = 2

[[step]]
name = "transfer"
run = "bun run showcases/secp-transfer/produce.ts committed"
timeout = "60s"
expect.tx = "committed"

[[step.assert.cell]]
out_point = { step = "transfer", index = 0 }
count = 1
