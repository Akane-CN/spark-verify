[meta]
name = "ckb-ugmp-spore-assertion-failure"
spec = "0.1.0-draft.3"
description = "The pinned CKB-UGMP mint commits, but an intentionally false live-Cell count claim fails."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"

[replay]
dependencies = []

[setup]
accounts = 1

[[step]]
name = "mint-spore"
run = "bun run showcases/ckb-ugmp/produce.ts committed"
timeout = "60s"
expect.tx = "committed"

[[step.assert.cell]]
out_point = { step = "mint-spore", index = 0 }
count = 0
