[meta]
name = "somo-cluster-rejected"
spec = "0.1.0-draft.3"
description = "A locally adapted SoMo Cluster transaction with a tampered secp256k1 signature is rejected."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"
ckb-debugger = "1.1.1"

[replay]
dependencies = []

[setup]
accounts = 1

[[step]]
name = "bad-cluster-signature"
