[meta]
name = "cell-properties-dao"
spec = "0.1.0-draft.4"

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"

[replay]
dependencies = []

[setup]
accounts = 2

[[step]]
name = "deposit"
run = "bun run showcases/cell-properties/produce.ts plain"
timeout = "60s"
expect.tx = "committed"

[[step.assert.cell]]
out_point = { step = "deposit", index = 0 }
count = 1
type = { builtin = "dao", args_bytes = 0 }
data = { min_bytes = 1 }

[[step.assert.cell_deps]]
step = "deposit"
contains = { builtin = "dao" }
