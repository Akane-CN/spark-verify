[meta]
name = "repository-script-committed"
spec = "0.2.0"
description = "Deploy a repository lock, create Cells under it, and spend one with the matching witness."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"
ckb-debugger = "1.1.1"

[replay]
dependencies = []

[setup]
accounts = 2

[setup.scripts.witness_lock]
binary = "showcases/repository-script/build/witness_lock"
hash_type = "type"

[setup.scripts.witness_lock_v1]
binary = "showcases/repository-script/build/witness_lock"
hash_type = "data1"

[setup.scripts.signer_lock]
builtin = "secp256k1_blake160_sighash_all"

[[step]]
name = "inspect deployment"
run = "bun run showcases/repository-script/produce.ts inspect"

[[step.assert.cell]]
lock = "witness_lock"
count = 0

[[step.assert.balance]]
lock = { script = "signer_lock", args = "0x9d1edebedf8f026c0d597c4c5cd3f45dec1f7557" }
gte = "1 shannon"

[[step]]
name = "create protected cells"
run = "bun run showcases/repository-script/produce.ts create"
expect.tx = "committed"

[[step.assert.cell]]
out_point = { step = "create protected cells", index = 0 }
lock = { script = "witness_lock", args = "0x01" }
count = 1
capacity.eq = "300 CKB"

[[step.assert.cell]]
out_point = { step = "create protected cells", index = 1 }
lock = { script = "witness_lock_v1", args = "0x02" }
count = 1

[[step]]
name = "spend with matching witness"
run = "bun run showcases/repository-script/produce.ts spend-matching"
expect.tx = "committed"
expect.cycles.lt = 100_000

[[step.assert.cell_deps]]
step = "spend with matching witness"
contains = { script = "witness_lock" }

[[assert.cell]]
out_point = { step = "create protected cells", index = 0 }
count = 0

[[assert.cell]]
out_point = { step = "create protected cells", index = 1 }
lock = { script = "witness_lock_v1", args = "0x02" }
count = 1

[[assert.cell]]
out_point = { step = "spend with matching witness", index = 0 }
lock = { account = 1 }
capacity.eq = "299.999 CKB"
