[meta]
name = "repository-script-pure-writes-result"
spec = "0.2.0"
description = "Negative control: a pure step that writes CKB_VERIFY_RESULT gets no verdict."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"
ckb-debugger = "1.1.1"

[replay]
dependencies = []

[setup]
accounts = 2

[setup.scripts.witness_lock]
binary = "showcases/repository-script/build/witness_lock"
hash_type = "type"

[setup.scripts.witness_lock_v1]
binary = "showcases/repository-script/build/witness_lock"
hash_type = "data1"

[[step]]
name = "pure step that writes a result"
run = "bun run showcases/repository-script/produce.ts pure-writes-result"

[[assert.cell]]
lock = "witness_lock"
count = 0
