name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit, types, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and type checks
        run: bun run check
      - name: Validate documentation
        run: ./scripts/validate-docs.sh --examples

  checks-macos:
    name: macOS boundary (offline commands only)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and run the platform-independent tests
        run: |
          bun run typecheck
          bun test tests/canonical.test.ts tests/manifest.test.ts tests/schemas.test.ts tests/offline.test.ts \
            tests/report.test.ts tests/cell-claims.test.ts tests/cell-claims-schema.test.ts tests/provenance.test.ts \
            tests/transaction.test.ts tests/evidence-bundle.test.ts tests/release-evidence.test.ts \
            tests/package-layout.test.ts tests/cli.test.ts tests/documentation-evidence.test.ts
      - name: Offline commands work on macOS
        run: |
          set -euo pipefail
          bun run src/cli.ts validate verify.toml
          bun run src/cli.ts digest docs/examples/secp-transfer-committed-report.json --allow-legacy
      - name: Running a manifest is refused before any runtime mutation
        run: |
          set +e
          output=$(bun run src/cli.ts run verify.toml 2>&1); status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q "requires Linux x64" <<<"$output"
          test ! -e .ckb-verify/offckb/accounts.json
          test -z "$(find .ckb-verify -name report.json 2>/dev/null)"

  dogfood:
    name: Root manifest through the reusable workflow
    uses: ./.github/workflows/ckb-verify-reusable.yml
    with:
      manifest: verify.toml
      command: bun run src/cli.ts

  secp-transfer:
    name: Secp transfer showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fresh-devnet showcase
        run: bun run showcase:secp-transfer
      - name: Package sanitized evidence
        run: >
          bun run scripts/package-evidence.ts --out evidence/secp-transfer
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --workflow "$GITHUB_WORKFLOW" --job secp-transfer
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-secp-transfer-${{ github.sha }}
          path: evidence/secp-transfer
          if-no-files-found: error
          retention-days: 30

  cell-properties:
    name: Cell properties showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Check Node runtime
        run: node --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fresh-devnet Cell-property matrix
        run: bun run showcase:cell-properties
      - name: Package sanitized evidence
        run: >
          bun run scripts/package-evidence.ts --out evidence/cell-properties
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --workflow "$GITHUB_WORKFLOW" --job cell-properties
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-cell-properties-${{ github.sha }}
          path: evidence/cell-properties
          if-no-files-found: error
          retention-days: 30

  ckb-ugmp:
    name: CKB-UGMP showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fresh-devnet CKB-UGMP showcase
        run: bun run showcase:ckb-ugmp
      - name: Package sanitized evidence
        run: >
          bun run scripts/package-evidence.ts --out evidence/ckb-ugmp
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --workflow "$GITHUB_WORKFLOW" --job ckb-ugmp
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-ckb-ugmp-${{ github.sha }}
          path: evidence/ckb-ugmp
          if-no-files-found: error
          retention-days: 30

  verify-evidence:
    name: Download and verify evidence bundles
    needs: [secp-transfer, cell-properties, ckb-ugmp]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read back this run's artifacts through the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate > artifacts.json
          bun -e '
            const expected = ["secp-transfer", "cell-properties", "ckb-ugmp"].map(job => `evidence-${job}-${process.env.GITHUB_SHA}`);
            const listed = JSON.parse(await Bun.file("artifacts.json").text()).artifacts;
            const lines = [];
            for (const name of expected) {
              const artifact = listed.find(entry => entry.name === name && !entry.expired);
              if (artifact === undefined || artifact.size_in_bytes <= 0) throw new Error(`artifact ${name} was not published by this run`);
              lines.push(`| ${name} | ${artifact.id} | ${artifact.size_in_bytes} | ${artifact.expires_at} |`);
            }
            const summary = ["| artifact | id | bytes | expires |", "| --- | --- | --- | --- |", ...lines].join("\n");
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) await Bun.write(process.env.GITHUB_STEP_SUMMARY, `## Evidence artifacts\n\n${summary}\n`);
          '
      - name: Download every evidence bundle of this run into a separate directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*-${{ github.sha }}
          path: downloaded-evidence
      - name: Verify the downloaded bundles with the offline verifier
        run: |
          set -euo pipefail
          count=0
          for bundle in downloaded-evidence/*/; do
            count=$((count + 1))
            bun run src/cli.ts check-bundle "$bundle" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          done
          test "$count" -eq 3
      - name: Assemble the release-evidence archive from the verified bundles
        run: >
          bun run scripts/release-evidence.ts assemble
          --out "release-evidence/release-evidence-$GITHUB_SHA.tar.gz"
          --bundle "downloaded-evidence/evidence-secp-transfer-$GITHUB_SHA"
          --bundle "downloaded-evidence/evidence-cell-properties-$GITHUB_SHA"
          --bundle "downloaded-evidence/evidence-ckb-ugmp-$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Verify the archive the way a consumer would (tar, sha256sum, check-bundle)
        run: |
          set -euo pipefail
          mkdir consumer-check
          (cd release-evidence && sha256sum -c --strict "release-evidence-$GITHUB_SHA.tar.gz.sha256")
          tar -xzf "release-evidence/release-evidence-$GITHUB_SHA.tar.gz" -C consumer-check
          (cd consumer-check/release-evidence && sha256sum -c --strict --quiet SHA256SUMS)
          count=0
          for bundle in consumer-check/release-evidence/bundles/*/; do
            count=$((count + 1))
            bun run src/cli.ts check-bundle "$bundle" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          done
          test "$count" -eq 3
      - name: Upload the release-evidence archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Read back the release-evidence artifact through the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate > release-artifacts.json
          bun -e '
            const name = `release-evidence-${process.env.GITHUB_SHA}`;
            const listed = JSON.parse(await Bun.file("release-artifacts.json").text()).artifacts;
            const artifact = listed.find(entry => entry.name === name && !entry.expired);
            if (artifact === undefined || artifact.size_in_bytes <= 0) throw new Error(`artifact ${name} was not published by this run`);
            const sha256 = (await Bun.file(`release-evidence/release-evidence-${process.env.GITHUB_SHA}.tar.gz.sha256`).text()).trim();
            const summary = ["| artifact | id | bytes | expires | archive sha256 |", "| --- | --- | --- | --- | --- |",
              `| ${name} | ${artifact.id} | ${artifact.size_in_bytes} | ${artifact.expires_at} | ${sha256.split(" ")[0]} |`].join("\n");
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) await Bun.write(process.env.GITHUB_STEP_SUMMARY, `## Release evidence\n\n${summary}\n`);
          '
