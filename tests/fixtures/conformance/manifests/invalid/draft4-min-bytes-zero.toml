[meta]
name = "conformance-draft4"
spec = "0.1.0-draft.4"
description = "final assertions and dotted tables"

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"

[replay]
dependencies = []

[setup]
accounts = 1

[[step]]
name = "deposit"
run = "bun run produce.ts dao"
timeout = "600s"
expect.tx = "committed"

[[assert.cell]]
out_point = { step = "deposit", index = 0 }
count = 1
type = { builtin = "dao", args_bytes = 0 }
data = { min_bytes = 0 }

[[assert.cell]]
out_point = { step = "deposit", index = 1 }
count = 0

[[assert.cell_deps]]
step = "deposit"
contains = { builtin = "dao" }
