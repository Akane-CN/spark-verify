# Repository-root dogfood manifest: ckb-verify verifies its own secp256k1 transfer producer on a fresh
# OffCKB devnet. It is dogfooding, not independent proof; see docs/proposal-coverage.md.
[meta]
name = "ckb-verify-dogfood"
spec = "0.1.0-draft.4"
description = "The repository's own producer commits a 100 CKB transfer and leaves one live output Cell."

[toolchain]
ckb = "0.209.0"
offckb = "0.4.13"

[replay]
dependencies = []

[setup]
accounts = 2

[[step]]
name = "transfer"
run = "bun run showcases/secp-transfer/produce.ts committed"
timeout = "60s"
expect.tx = "committed"

[[step.assert.cell]]
out_point = { step = "transfer", index = 0 }
count = 1

[[assert.cell]]
out_point = { step = "transfer", index = 0 }
count = 1
